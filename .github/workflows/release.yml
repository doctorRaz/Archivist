name: Release

on:
  push:
    tags:
      - 'Archivist_*.*-release*'
      - 'Archivist_*.*-mandatory*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release configuration
        id: config
        shell: pwsh
        run: |
          $config = Get-Content '.github/release.config.json' -Raw | ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace($config.solution)) {
              throw "Release configuration must contain 'solution'."
          }

          if ($null -eq $config.projects -or @($config.projects).Count -eq 0) {
              throw "Release configuration must contain at least one project in 'projects'."
          }

          $solutionPath = $config.solution
          if (-not (Test-Path $solutionPath -PathType Leaf)) {
              throw "Solution was not found: $solutionPath"
          }

          $projectPaths = @($config.projects)
          foreach ($projectPath in $projectPaths) {
              if (-not (Test-Path $projectPath -PathType Leaf)) {
                  throw "Project was not found: $projectPath"
              }
          }

          $product = [System.IO.Path]::GetFileNameWithoutExtension($solutionPath)

          Write-Host "Solution: $solutionPath"
          Write-Host "Projects:"
          $projectPaths | ForEach-Object { Write-Host "  $_" }

          "solution_path=$solutionPath" >> $env:GITHUB_OUTPUT
          "product=$product" >> $env:GITHUB_OUTPUT
          "projects_json=$($projectPaths | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^Archivist_\d+\.\d+-(release|mandatory)\d*$') {
              throw "Invalid release tag: $env:TAG_NAME"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      # Вычисляем версию релиза ОДИН РАЗ.
      # Major и Minor берутся из первого публикуемого проекта и используются
      # только для формирования общей версии релиза: имени ZIP, update.json
      # и других release-метаданных.
      #
      # При публикации каждый проект сохраняет собственные Major и Minor,
      # определённые его Version/Directory.Build.props. Общими для всех
      # проектов являются только Build и Revision, переданные workflow.
      - name: Calculate release version
        id: version
        shell: pwsh
        env:
          PROJECTS_JSON: ${{ steps.config.outputs.projects_json }}
        run: |
          $projectPaths = $env:PROJECTS_JSON | ConvertFrom-Json
          $versionProject = @($projectPaths)[0]

          # Получаем базовую Major.Minor первого release-проекта для формирования
          # общей версии релиза. Это не задаёт Major.Minor другим проектам.
          $baseVersion = (dotnet msbuild "$versionProject" -getProperty:Version).Trim()

          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
              throw "Version is empty in project: $versionProject"
          }

          try {
              $versionParts = $baseVersion.Split('.')
              $major = [int]$versionParts[0]
              $minor = [int]$versionParts[1]
          }
          catch {
              throw "Invalid Version in project: $versionProject ($baseVersion)"
          }

          $build = [int]([DateTime]::UtcNow - [DateTime]::Parse('2000-01-01')).TotalDays
          $revision = [int]([Math]::Floor(([DateTime]::UtcNow.TimeOfDay.TotalSeconds) / 2))
          $fullVersion = "$major.$minor.$build.$revision"

          Write-Host "Release version: $fullVersion"

          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "full_version=$fullVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Test
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet test "$env:SOLUTION_PATH" --configuration Release --no-restore --verbosity normal

      - name: Publish release projects
        shell: pwsh
        env:
          PROJECTS_JSON: ${{ steps.config.outputs.projects_json }}
          BUILD: ${{ steps.version.outputs.build }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          $projectPaths = $env:PROJECTS_JSON | ConvertFrom-Json
          $staging = Join-Path $env:RUNNER_TEMP 'Archivist-release'

          if (Test-Path $staging) {
              Remove-Item $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          foreach ($projectPath in $projectPaths) {
              $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
              $projectOutput = Join-Path $env:RUNNER_TEMP "publish-$projectName"

              if (Test-Path $projectOutput) {
                  Remove-Item $projectOutput -Recurse -Force
              }

              New-Item -ItemType Directory -Path $projectOutput -Force | Out-Null

              dotnet publish "$projectPath" `
                  --configuration Release `
                  --no-restore `
                  --output "$projectOutput" `
                  -p:Build=$env:BUILD `
                  -p:Revision=$env:REVISION

              Get-ChildItem -Path $projectOutput -File | ForEach-Object {
                  Copy-Item $_.FullName -Destination $staging -Force
              }
          }

      - name: Create release archive
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'Archivist-release'
          $archive = Join-Path $env:RUNNER_TEMP "$env:PRODUCT.$env:FULL_VERSION.zip"

          if (Test-Path $archive) {
              Remove-Item $archive -Force
          }

          Get-ChildItem -Path $staging -Filter '*.pdb' -File | Remove-Item -Force
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive -CompressionLevel Optimal

          "archive=$archive" >> $env:GITHUB_ENV

      - name: Determine release type
        id: release_type
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -match '-mandatory\d*$') {
              "mandatory=true" >> $env:GITHUB_OUTPUT
          }
          else {
              "mandatory=false" >> $env:GITHUB_OUTPUT
          }

      - name: Read minimum version
        id: minimum_version
        shell: pwsh
        env:
          MANDATORY: ${{ steps.release_type.outputs.mandatory }}
        run: |
          if ($env:MANDATORY -eq 'true') {
              $path = '.github/version-release/mandatory-version.txt'
          }
          else {
              $path = '.github/version-release/release_version.txt'
          }

          if (-not (Test-Path $path -PathType Leaf)) {
              throw "Minimum version file was not found: $path"
          }

          $minimumVersion = (Get-Content $path -Raw).Trim()
          "value=$minimumVersion" >> $env:GITHUB_OUTPUT

      - name: Create update manifest
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          BUILD: ${{ steps.version.outputs.build }}
          REVISION: ${{ steps.version.outputs.revision }}
          TAG_NAME: ${{ github.ref_name }}
          MANDATORY: ${{ steps.release_type.outputs.mandatory }}
          MINIMUM_VERSION: ${{ steps.minimum_version.outputs.value }}
          ARCHIVE: ${{ env.archive }}
        run: |
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $env:ARCHIVE).Length
          $assetName = [System.IO.Path]::GetFileName($env:ARCHIVE)
          $commit = '${{ github.sha }}'
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $minimumParts = $env:MINIMUM_VERSION.Split('.')

          $manifest = [ordered]@{
              product = $env:PRODUCT
              version = [ordered]@{
                  major = [int]$env:MAJOR
                  minor = [int]$env:MINOR
                  build = [int]$env:BUILD
                  revision = [int]$env:REVISION
              }
              tag = $env:TAG_NAME
              asset = $assetName
              sha256 = $hash
              size = $size
              commit = $commit
              mandatory = [bool]::Parse($env:MANDATORY)
              minimumVersion = [ordered]@{
                  major = [int]$minimumParts[0]
                  minor = [int]$minimumParts[1]
                  build = [int]$minimumParts[2]
                  revision = [int]$minimumParts[3]
              }
              publishedAt = $publishedAt
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP 'update.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8
          "manifest=$manifestPath" >> $env:GITHUB_ENV

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.config.outputs.product }} ${{ steps.version.outputs.full_version }}
          generate_release_notes: true
          files: |
            ${{ env.archive }}
            ${{ env.manifest }}

      - name: Add release description to archive
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ env.archive }}
        run: |
          $release = Invoke-RestMethod `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID"

          $description = Join-Path $env:RUNNER_TEMP 'release-description.md'
          Set-Content $description $release.body -Encoding utf8

          $temp = Join-Path $env:RUNNER_TEMP 'final-release'
          if (Test-Path $temp) {
              Remove-Item $temp -Recurse -Force
          }
          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          Expand-Archive -Path $env:ARCHIVE -DestinationPath $temp
          Copy-Item $description -Destination (Join-Path $temp 'release-description.md') -Force

          Remove-Item $env:ARCHIVE -Force
          Compress-Archive -Path (Join-Path $temp '*') -DestinationPath $env:ARCHIVE -CompressionLevel Optimal

      - name: Update manifest checksum and size
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          BUILD: ${{ steps.version.outputs.build }}
          REVISION: ${{ steps.version.outputs.revision }}
          TAG_NAME: ${{ github.ref_name }}
          MANDATORY: ${{ steps.release_type.outputs.mandatory }}
          MINIMUM_VERSION: ${{ steps.minimum_version.outputs.value }}
          ARCHIVE: ${{ env.archive }}
          MANIFEST: ${{ env.manifest }}
        run: |
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $env:ARCHIVE).Length
          $assetName = [System.IO.Path]::GetFileName($env:ARCHIVE)
          $commit = '${{ github.sha }}'
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $minimumParts = $env:MINIMUM_VERSION.Split('.')

          $manifest = [ordered]@{
              product = $env:PRODUCT
              version = [ordered]@{
                  major = [int]$env:MAJOR
                  minor = [int]$env:MINOR
                  build = [int]$env:BUILD
                  revision = [int]$env:REVISION
              }
              tag = $env:TAG_NAME
              asset = $assetName
              sha256 = $hash
              size = $size
              commit = $commit
              mandatory = [bool]::Parse($env:MANDATORY)
              minimumVersion = [ordered]@{
                  major = [int]$minimumParts[0]
                  minor = [int]$minimumParts[1]
                  build = [int]$minimumParts[2]
                  revision = [int]$minimumParts[3]
              }
              publishedAt = $publishedAt
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content $env:MANIFEST -Encoding utf8

      - name: Upload final archive and manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ env.archive }}
          MANIFEST: ${{ env.manifest }}
        run: |
          gh release upload "${{ github.ref_name }}" "$env:ARCHIVE" "$env:MANIFEST" --clobber
