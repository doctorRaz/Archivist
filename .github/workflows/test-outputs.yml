name: Test GITHUB_OUTPUT

# Тестовый workflow запускается только вручную из GitHub Actions.
on:
  workflow_dispatch:

jobs:
  test-outputs:
    name: Test values between steps
    runs-on: windows-latest

    steps:
      # Первый step вычисляет значения и передаёт их через GITHUB_OUTPUT.
      - name: Set values
        id: values
        shell: pwsh
        run: |
          # Эти значения существуют только внутри данного PowerShell-процесса.
          $product = "docProps"
          $version = "0.3.9748.10852"
          $archiveName = "${product}_${version}.zip"

          # GITHUB_OUTPUT сохраняет значения как outputs этого step.
          "product=$product" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

          Write-Host "=== Set values ==="
          Write-Host "product     = $product"
          Write-Host "version     = $version"
          Write-Host "archiveName = $archiveName"

      # Второй step получает значения из первого.
      - name: Read values - step 2
        env:
          PRODUCT: ${{ steps.values.outputs.product }}
          VERSION: ${{ steps.values.outputs.version }}
          ARCHIVE_NAME: ${{ steps.values.outputs.archive_name }}
        shell: pwsh
        run: |
          Write-Host "=== Step 2 ==="
          Write-Host "PRODUCT      = $env:PRODUCT"
          Write-Host "VERSION      = $env:VERSION"
          Write-Host "ARCHIVE_NAME = $env:ARCHIVE_NAME"

      # Третий step снова получает те же самые outputs.
      # Это показывает, что значение доступно не только следующему step.
      - name: Read values - step 3
        env:
          PRODUCT: ${{ steps.values.outputs.product }}
          VERSION: ${{ steps.values.outputs.version }}
          ARCHIVE_NAME: ${{ steps.values.outputs.archive_name }}
        shell: pwsh
        run: |
          Write-Host "=== Step 3 ==="
          Write-Host "PRODUCT      = $env:PRODUCT"
          Write-Host "VERSION      = $env:VERSION"
          Write-Host "ARCHIVE_NAME = $env:ARCHIVE_NAME"

      # Четвёртый step получает значения напрямую через expression.
      # Здесь специально не используем env, чтобы показать другой вариант.
      - name: Read values - step 4
        shell: pwsh
        run: |
          Write-Host "=== Step 4 ==="
          Write-Host "PRODUCT      = ${{ steps.values.outputs.product }}"
          Write-Host "VERSION      = ${{ steps.values.outputs.version }}"
          Write-Host "ARCHIVE_NAME = ${{ steps.values.outputs.archive_name }}"

      # Последний step показывает, что outputs всё ещё доступны.
      - name: Read values - step 5
        env:
          PRODUCT: ${{ steps.values.outputs.product }}
          VERSION: ${{ steps.values.outputs.version }}
          ARCHIVE_NAME: ${{ steps.values.outputs.archive_name }}
        shell: pwsh
        run: |
          Write-Host "=== Step 5 ==="
          Write-Host "PRODUCT      = $env:PRODUCT"
          Write-Host "VERSION      = $env:VERSION"
          Write-Host "ARCHIVE_NAME = $env:ARCHIVE_NAME"
