name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      
permissions:
    contents: read
  
jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: dotnet restore Archivist.sln

      - name: Build
        run: dotnet build Archivist.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Archivist.sln --configuration Release --no-build --verbosity normal
